name: Test

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: node scripts/check-speckit-extension.mjs
      - run: bun test
      - run: bun run build
      - run: node packages/dotdog/dist/cli.js --version
      - run: node packages/dotdog/dist/cli.js --help
      - run: node packages/dotdog/dist/cli.js validate
      - run: node packages/dotdog/dist/cli.js analyze --project dotdog
      - run: node packages/dotdog/dist/cli.js list
      - run: node scripts/check-pack.mjs
      - run: node scripts/check-release.mjs
      - run: bash scripts/demo.sh
      - run: node packages/dotdog/dist/cli.js check --json
      - run: node packages/dotdog/dist/cli.js status --json
