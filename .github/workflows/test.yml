name: Test

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: cd packages/dotdog && bun install
      - run: cd packages/dotdog && bun build src/cli.ts --outdir dist --target node
      - run: node packages/dotdog/dist/cli.js --version
      - run: node packages/dotdog/dist/cli.js --help
      - run: node packages/dotdog/dist/cli.js validate
      - run: node packages/dotdog/dist/cli.js analyze --project dotdog
      - run: node packages/dotdog/dist/cli.js staleness
      - run: node packages/dotdog/dist/cli.js list
