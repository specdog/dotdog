name: Version Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/dotdog/src/**'
      - 'packages/dotdog/package.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check version bump
        run: |
          PR_VERSION=$(node -p "require('./packages/dotdog/package.json').version")
          NPM_VERSION=$(npm view dotdog version)

          echo "PR version:  $PR_VERSION"
          echo "npm version: $NPM_VERSION"

          if [ "$PR_VERSION" = "$NPM_VERSION" ]; then
            echo ""
            echo "ERROR: version must be bumped in packages/dotdog/package.json"
            echo "  Current npm: $NPM_VERSION"
            echo "  PR version:  $PR_VERSION"
            echo ""
            echo "  Bug fix    → PATCH bump:  $NPM_VERSION → $(echo $NPM_VERSION | awk -F. '{print $1"."$2"."$3+1}')"
            echo "  Feature    → MINOR bump:  $NPM_VERSION → $(echo $NPM_VERSION | awk -F. '{print $1"."$2+1".0"}')"
            echo "  Breaking   → MAJOR bump:  $NPM_VERSION → $(echo $NPM_VERSION | awk -F. '{print $1+1".0.0"}')"
            exit 1
          fi

          # Verify version is newer
          NEWEST_VERSION=$(printf '%s\n%s\n' "$NPM_VERSION" "$PR_VERSION" | sort -V | tail -n 1)
          if [ "$NEWEST_VERSION" != "$PR_VERSION" ]; then
            echo ""
            echo "ERROR: PR version ($PR_VERSION) must be greater than npm version ($NPM_VERSION)"
            exit 1
          fi

          
          echo "✓ Version bumped: $NPM_VERSION → $PR_VERSION"
