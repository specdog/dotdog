name: Publish

on:
  push:
    tags: ['v*']

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: cd packages/dotdog && bun install
      - run: cd packages/dotdog && bun build src/cli.ts --outdir dist --target node
      - run: cd packages/dotdog && npm publish --provenance --access public
