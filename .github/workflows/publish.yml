name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Verify tag matches the package version
        shell: bash
        run: |
          version="$(node -p "require('./packages/dotdog/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version" || test "$GITHUB_REF_NAME" = "v$version-npm"
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: node scripts/check-pack.mjs
      - run: node scripts/check-release.mjs
      - run: cd packages/dotdog && npm publish --access public --provenance
