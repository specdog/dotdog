<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- ground -->
  <line x1="10" y1="112" x2="110" y2="112" stroke="#e5e7eb" stroke-width="2"/>
  <!-- legs -->
  <rect x="32" y="90" width="8" height="22" rx="3" fill="#d97706"/>
  <rect x="56" y="90" width="8" height="22" rx="3" fill="#d97706"/>
  <rect x="66" y="90" width="8" height="22" rx="3" fill="#d97706"/>
  <rect x="80" y="90" width="8" height="22" rx="3" fill="#d97706"/>
  <!-- body -->
  <ellipse cx="60" cy="78" rx="30" ry="18" fill="#f59e0b"/>
  <!-- tail -->
  <path d="M30 75 Q18 60 22 52" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="38" cy="32" rx="8" ry="11" fill="#d97706" transform="rotate(-12 38 32)"/>
  <ellipse cx="82" cy="32" rx="8" ry="11" fill="#d97706" transform="rotate(12 82 32)"/>
  <!-- head -->
  <circle cx="60" cy="52" r="22" fill="#f59e0b"/>
  <!-- eyes -->
  <circle cx="52" cy="48" r="3.5" fill="#1a1a2e"/>
  <circle cx="68" cy="48" r="3.5" fill="#1a1a2e"/>
  <circle cx="53" cy="47" r="1.2" fill="#fff"/>
  <circle cx="69" cy="47" r="1.2" fill="#fff"/>
  <!-- nose -->
  <ellipse cx="60" cy="57" rx="4" ry="3" fill="#1a1a2e"/>
  <!-- mouth -->
  <path d="M54 61 Q60 67 66 61" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
</svg>
