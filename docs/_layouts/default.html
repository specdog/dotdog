<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
{% include head-custom.html %}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #1a1a2e; max-width: 720px; margin: 0 auto; padding: 40px 24px; line-height: 1.75; }
  nav { display: flex; justify-content: center; align-items: center; gap: 18px; flex-wrap: wrap; width: min(calc(100vw - 48px), 960px); margin: 0 auto 32px; padding: 8px 0 0; }
  nav a { color: #6b7280; text-decoration: none; font-size: .9em; font-weight: 500; line-height: 1.4; }
  nav a:hover, nav a.active { color: #d97706; }
  h1 { font-size: 2.2em; margin-bottom: 8px; }
  h2 { font-size: 1.35em; margin: 36px 0 12px; border-bottom: 1px solid #e5e7eb; padding-bottom: 6px; }
  p, li { color: #4b5563; line-height: 1.6; }
  ul, ol { margin: 12px 0 12px 24px; }
  pre { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 14px 18px; font-size: .85em; overflow-x: auto; margin: 8px 0; }
  code { color: #2563eb; }
  blockquote { background: #fef3c7; border-left: 3px solid #f59e0b; padding: 12px 16px; border-radius: 4px; margin: 16px 0; }
  blockquote p { color: #92400e; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e5e7eb; }
  th { font-size: .85em; color: #6b7280; font-weight: 600; }
  td { font-size: .9em; }
  a { color: #d97706; }
  footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid #e5e7eb; text-align: center; font-size: .85em; color: #9ca3af; }
</style>
</head>
<body>
<nav>
  <a href="https://specdog.github.io/">specdog</a>
  <a href="https://specdog.github.io/dotdog/" class="active">dotdog</a>
  <a href="https://specdog.github.io/about">about</a>
  <a href="https://specdog.github.io/handbook">guide</a>
  <a href="https://specdog.github.io/agents">for agents</a>
  <a href="https://specdog.github.io/dogfood">dogfood</a>
  <a href="https://specdog.github.io/blog">blog</a>
  <a href="https://specdog.github.io/leash">leash</a>
  <a href="https://specdog.github.io/collar">collar</a>
</nav>
{{ content }}
</body>
</html>
